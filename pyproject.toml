[project]
name = "crypto-data"
version = "0.1.0"
description = "Historical OHLCV candle collector into a local Parquet store"
requires-python = ">=3.12"
dependencies = [
    "ccxt>=4.4",
    "pandas>=2.2",
    "pyarrow>=16",
]

# Installs a `collect` command, so the everyday case is `uv run collect` rather
# than remembering a module path. `python -m collector.cli` still works and needs
# no install, which is what the tests and a fresh checkout use.
[project.scripts]
collect = "collector.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/collector"]

# pythonpath lets `pytest` import `collector` straight from src/ without
# installing the package first. One less step between you and a green suite,
# and no editable-install confusion to debug later.
[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
